name: Build Thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Diploma Thesis LaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Rename output PDF to DP_pavlik_SLM.pdf
        run: mv thesis/main.pdf thesis/DP_pavlik_SLM.pdf

      - name: Upload PDF artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: DP_pavlik_SLM.pdf
          path: thesis/DP_pavlik_SLM.pdf
          if-no-files-found: error

      - name: Update floating 'latest' tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish floating 'Latest Draft' Pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Diplomová práce (Latest Draft)"
          RELEASE_BODY="### 🎓 Diplomová práce: Small Language Models (SLM) na malých datech
          *Automaticky aktualizovaný koncept z větve \`main\` (poslední commit: \`${{ github.sha }}\`).*

          #### 📥 Přiložené soubory v sekci Assets:
          - 📄 **\`DP_pavlik_SLM.pdf\`** – Aktuální zkompilovaný text diplomové práce
          - 🤖 **\`best_models.tar.gz\`** – Váhy nejlepších modelů z faktorového pokusu a tokenizéry
          - 📚 **\`toki_pona_corpus.tar.gz\`** – Vyčištěný a rozdělený korpus jazyka toki pona

          👉 **[Stáhnout PDF přímo](https://github.com/${{ github.repository }}/releases/download/latest/DP_pavlik_SLM.pdf)**"

          FILES="thesis/DP_pavlik_SLM.pdf release_assets/best_models.tar.gz release_assets/toki_pona_corpus.tar.gz"

          if gh release view latest >/dev/null 2>&1; then
            echo "Aktualizuji existující release 'latest'..."
            gh release edit latest --title "$RELEASE_TITLE" --notes "$RELEASE_BODY" --prerelease
            gh release upload latest $FILES --clobber
          else
            echo "Vytvářím nový release 'latest'..."
            gh release create latest $FILES \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_BODY" \
              --prerelease
          fi
