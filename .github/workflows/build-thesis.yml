name: Build Thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Diploma Thesis LaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Rename output PDF to DP_pavlik_SLM.pdf
        run: mv thesis/main.pdf thesis/DP_pavlik_SLM.pdf

      - name: Upload PDF artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: DP_pavlik_SLM.pdf
          path: thesis/DP_pavlik_SLM.pdf
          if-no-files-found: error

      - name: Update latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Publish to GitHub Releases (sidebar)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Diplomová práce (aktuální PDF)"
          body: "Automaticky zkompilovaná diplomová práce z větve `main` (commit `${{ github.sha }}`)."
          files: thesis/DP_pavlik_SLM.pdf
